<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
<link rel="canonical" href="{{ page.url | prepend: site.url }}">

<style>
:root {
    --width: 1040px;
    --font-main: Arial, Helvetica, sans-serif;
    --font-secondary: Georgia, "Times New Roman", serif;
    --font-scale: 1.05em;
    --background-color: #e1c454;
    --heading-color: #111;
    --text-color: #171717;
    --link-color: #4962fa;
    --muted-color: #56542d;
    --border-color: #111;
    --code-background-color: #fffdf1;
    --code-color: #111;
    --card-color: #fffdf1;
}

* {
    box-sizing: border-box;
}

body {
    max-width: var(--width);
    margin: 0 auto;
    padding: 3rem 2rem 4rem;
    background: var(--background-color);
    color: var(--text-color);
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    line-height: 1.65;
    overflow-wrap: anywhere;
}

body.post main {
    background: var(--card-color); 
    border-radius: 25px;
    padding: 2rem;
    margin-top: 0;
}

body.home main {
    background: var(--card-color); 
    border-radius: 25px;
    padding: 3rem;
    margin-top: 1rem;
}

header {
    margin-bottom: 4rem;
    padding-bottom: 1.5rem;
    border-bottom: 5px solid var(--border-color);
}

.title {
    color: var(--heading-color);
    text-decoration: none;
}

.title h1 {
    margin: 0 0 1.25rem;
    font-family: var(--font-main);
    font-size: clamp(4rem, 11vw, 8rem);
    font-weight: 900;
    letter-spacing: -0.085em;
    line-height: 0.78;
    text-transform: uppercase;
}

nav p {
    display: flex;
    flex-wrap: wrap;
    gap: 0.55rem;
    margin: 0;
}

nav a {
    display: inline-block;
    padding: 0.3rem 0.6rem;
    background: var(--heading-color);
    color: var(--background-color);
    font-family: var(--font-main);
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-decoration: none;
    text-transform: uppercase;
}

nav a:hover,
nav a:focus-visible {
    background: var(--link-color);
    color: #fff;
}

h1, h2, h3, h4, h5, h6 {
    color: var(--heading-color);
    font-family: var(--font-main);
    font-weight: 900;
    letter-spacing: -0.055em;
    line-height: 1;
}

main > h1 {
    max-width: 16ch;
    margin-bottom: 2rem;
    margin-top: .25rem;
    font-size: clamp(3rem, 8vw, 6rem);
    color: var(--link-color); 
}

h2 {
    margin-top: 3rem;
    font-size: 2rem;
    color: #64402c;
}

a {
    color: var(--link-color);
    text-decoration-thickness: 2px;
    text-underline-offset: 0.18em;
}

a:focus-visible,
button:focus-visible {
    outline: 3px solid var(--link-color);
    outline-offset: 4px;
}

strong,
b {
    color: var(--heading-color);
}

time {
    color: var(--muted-color);
    font-family: var(--font-main);
    font-size: 0.72rem;
    font-style: normal;
    font-weight: 800;
    letter-spacing: 0.07em;
    text-transform: uppercase;
}

blockquote {
    margin: 2.5rem 0;
    padding: 1.5rem;
    background: #96a5df;
    color: #fff;
    font-size: 1.15rem;
    font-style: italic;
}

blockquote a,
blockquote strong {
    color: #fff;
}

code {
    padding: 0.12em 0.3em;
    background: var(--code-background-color);
    color: var(--code-color);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
}

.highlight,
.code,
pre {
    max-width: 100%;
    margin-block: 2rem;
    padding: 1rem;
    overflow-x: auto;
    border: 3px solid var(--border-color);
    background: var(--code-background-color);
}

table {
    display: block;
    width: 100%;
    overflow-x: auto;
    border-collapse: collapse;
    white-space: nowrap;
}

th,
td {
    padding: 0.6rem 1.1rem 0.6rem 0;
    border-bottom: 2px solid var(--border-color);
    text-align: left;
}

img {
    max-width: 100%;
    height: auto;
    border: 3px solid var(--border-color);
}

hr {
    margin-block: 3rem;
    border: 0;
    border-top: 5px solid var(--border-color);
}


ul.blog-posts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.35rem;
    margin: 0 0 2.5rem;
    padding: 0;
    list-style: none;
}

ul.blog-posts li {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-width: 0;
    min-height: 15rem;
    padding: 1.5rem;
    border: 3px solid var(--border-color);
    background: var(--card-color);
    box-shadow: 7px 7px 0 var(--border-color);
    border-radius: 25px;
}

ul.blog-posts li:first-child {
    grid-column: 1 / -1;
    min-height: 18rem;
}

ul.blog-posts li > span {
    order: 2;
    margin-top: auto;
}

ul.blog-posts li > a {
    order: 1;
    color: var(--heading-color);
    font-family: var(--font-main);
    font-size: clamp(1.7rem, 4.5vw, 3rem);
    font-weight: 900;
    letter-spacing: -0.055em;
    line-height: 0.98;
    text-decoration: none;
}

ul.blog-posts li:first-child > a {
    max-width: 19ch;
    font-size: clamp(2.3rem, 6vw, 4.6rem);
    background: var(--code-background-color);
}

ul.blog-posts li > a:hover {
    color: var(--link-color);
}

footer {
    margin-top: 5rem;
    padding-top: 1rem;
    border-top: 5px solid var(--border-color);
    color: var(--muted-color);
    font-family: var(--font-main);
    font-size: 0.7rem;
    font-weight: 700;
}

button {
    cursor: pointer;
}

@media (max-width: 650px) {
    body {
        padding: 2.5rem 1rem 3rem;
    }

    header {
        margin-bottom: 3rem;
    }

    .title h1 {
        font-size: clamp(3.6rem, 21vw, 6rem);
    }

    ul.blog-posts {
        grid-template-columns: minmax(0, 1fr);
    }

    ul.blog-posts li,
    ul.blog-posts li:first-child {
        grid-column: auto;
        min-height: 12rem;
        padding: 1.2rem;
        box-shadow: 5px 5px 0 var(--border-color);
    }

    ul.blog-posts li > a,
    ul.blog-posts li:first-child > a {
        font-size: clamp(1.8rem, 9vw, 2.7rem);
    }
}
</style>
